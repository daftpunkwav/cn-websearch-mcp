---
# Codacy configuration. Once this file exists, Codacy stops applying the
# "Ignored files" settings configured in the Codacy UI — file exclusions are
# governed here from now on.
#
# Excluded here are the paths where AST-level analysis only ever produces
# noise:
# - test/: the suite's fixtures intentionally repeat long literals (frozen
#   wire payloads, mirrored fixture/assertion pairs) and stub scaffolding.
# - package-lock.json: generated by npm; dependency risk is owned by the
#   dependency audit gate (npm-audit-check) and the denylist checker, not by
#   code analysis.
# - dist/ and coverage/: build and test-runner output, regenerated on every
#   run; excluded defensively in case they are ever committed by accident.
exclude_paths:
  - "test/**"
  - "package-lock.json"
  - "dist/**"
  - "coverage/**"
