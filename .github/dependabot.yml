# Dependabot configuration.
#
# The github-actions entry is the important one: every "uses:" in the workflows is
# pinned to a full commit SHA, and this is what keeps those pins current without
# anyone hand-editing them. Tag-based refs (dtolnay/rust-toolchain@<version>,
# taiki-e/install-action@<branch>) are intentionally left unpinned - pinning those
# would freeze the toolchain and break the msrv/stable gates.
#
# Updates are grouped so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # "Highest usable" cap: @types/node tracks the newest Node major, but the
    # test matrix (ci.yml) exercises 18/20/22 - typings ahead of the tested
    # runtime describe APIs nothing verifies. Raise together with the matrix.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
      # vitest 5 pulls vite 8, whose peers reject @types/node 18 - and the
      # matrix still tests Node 18. Raise together with the matrix floor.
      - dependency-name: "vitest"
        versions: [">=4"]
      - dependency-name: "@vitest/mocker"
        versions: [">=4"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=4"]
      # PR #22: a tinypool security alert generated a PR that dragged vitest
      # to 5 despite the ignore above (the ignore covers the dependency's own
      # updates, but tinypool was unlisted, and Dependabot pulls its
      # "ancestor dependencies" along). tinypool 2.x only exists under vitest
      # 5, so suppressing it here keeps the matrix floor intact; the finding
      # itself is accepted in scripts/ci/npm-audit-allowlist.json. Drop this
      # when the matrix leaves Node 18 and vitest 4 lands.
      - dependency-name: "tinypool"
        versions: [">=2"]
      # PR #26: TypeScript 7 is the native-port (Go) rewrite. The lint
      # toolchain (@typescript-eslint/typescript-estree 8.x, ts-api-utils 2.x)
      # crashes on load against it ("Cannot read properties of undefined
      # (reading 'Intrinsic')"), and typescript-estree's supported range stops
      # at <6.1.0. Block the major until @typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-development:
        dependency-type: "development"
      npm-production:
        dependency-type: "production"