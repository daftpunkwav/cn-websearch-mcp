# Dependabot configuration.
#
# The github-actions entry is the important one: every "uses:" in the workflows is
# pinned to a full commit SHA, and this is what keeps those pins current without
# anyone hand-editing them. Tag-based refs (dtolnay/rust-toolchain@<version>,
# taiki-e/install-action@<branch>) are intentionally left unpinned - pinning those
# would freeze the toolchain and break the msrv/stable gates.
#
# Updates are grouped so the required-approval flow stays reviewable.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    # "Highest usable" cap: @types/node tracks the newest Node major, but the
    # test matrix (ci.yml) exercises 18/20/22 - typings ahead of the tested
    # runtime describe APIs nothing verifies. Raise together with the matrix.
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
      # vitest 5 declares engines.node ^20.19 || ^22.12 || >=24 and pulls
      # vite 8, so it needs a newer runtime than the Node 18 matrix row
      # provides. Raise together with the matrix floor.
      - dependency-name: "vitest"
        versions: [">=5"]
      - dependency-name: "@vitest/mocker"
        versions: [">=5"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=5"]
      # PR #26: TypeScript 7 is the native-port (Go) rewrite. The lint
      # toolchain (@typescript-eslint/typescript-estree 8.x, ts-api-utils 2.x)
      # crashes on load against it ("Cannot read properties of undefined
      # (reading 'Intrinsic')"), and typescript-estree's supported range stops
      # at <6.1.0. Block the major until @typescript-eslint ships TS 7 support.
      - dependency-name: "typescript"
        versions: [">=7"]
      # PRs #27 and #29: eslint 10 cannot be installed. eslint-config-airbnb-
      # extended 3.3.0 is the latest release and declares peer eslint@"^9.0.0",
      # so npm ci aborts with ERESOLVE and every install-dependent CI job
      # (lint plus the whole node 18/20/22 matrix) fails. #27 reached the same
      # wall and was merged back down to 9.39.5, which leaves the range at ^9
      # and makes Dependabot re-propose the bump weekly. Block the major here
      # rather than in the lockfile. Drop this when eslint-config-airbnb-
      # extended declares support for eslint 10.
      - dependency-name: "eslint"
        versions: [">=10"]
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-development:
        dependency-type: "development"
      npm-production:
        dependency-type: "production"