name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only check out code and publish no artifacts.
permissions:
  contents: read

jobs:
  changes:
    # Fail-open docs triage: only markdown/LICENSE-only diffs skip the test
    # matrix; anything unrecognized counts as code and runs everything.
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a code file renamed into docs/ must classify as
          # code (both sides of the rename are listed). Fail closed: a diff
          # error runs everything rather than skipping it.
          if ! changed="$(git diff --no-renames --name-only "$BASE...HEAD")"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docs_only=true
          while IFS= read -r f; do
            case "$f" in
              *.md|LICENSE|.gitignore|.gitattributes|docs/*) ;;
              *) docs_only=false ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install and test steps execute PR code; a persisted checkout
          # token would be readable there.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # test/ and scripts/ are outside the build's tsconfig, so they need their own type check
      - run: npm run typecheck
      # e2e tests in test/e2e/ exercise dist/, so build must precede tests
      - run: npm run test:coverage

  # Style gate: Airbnb ESLint config over src/, test/, scripts/ and the root
  # config files. Single job (lint result does not vary by Node version the
  # way runtime behavior can); the devDependency toolchain requires Node >= 18.18,
  # so it runs on the newest matrix version rather than the floor.
  lint:
    name: Lint (Airbnb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install and lint steps execute PR code; a persisted checkout
          # token would be readable there.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Lint needs no lifecycle scripts: the toolchain's native pieces
      # (unrs-resolver, esbuild) ship as prebuilt optionalDependencies, so
      # installation never executes third-party postinstall code.
      - run: npm ci --ignore-scripts
      - run: npm run lint

  # This workflow has no path filtering (single-package repo, every job runs
  # on every push/PR), so edits to dependency-policy.json or the checker
  # itself always re-trigger this job.
  deps-policy:
    name: Dependency denylist (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install and test steps execute PR code; a persisted checkout
          # token would be readable there.
          persist-credentials: false
      # Reads package-lock.json plus package.json only; no npm install needed.
      - run: node scripts/ci/check_npm_deps_policy.mjs

  gate:
    name: gate
    # Summary check: always runs, passes when every job that ran succeeded
    # (skipped is fine) and fails on any failure or cancellation, so a
    # cancelled run can never masquerade as green.
    needs: [changes, build-and-test, deps-policy, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate results
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          DEPS_POLICY: ${{ needs.deps-policy.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          set -euo pipefail
          results="changes=$CHANGES build_and_test=$BUILD_AND_TEST deps_policy=$DEPS_POLICY lint=$LINT"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all gates passed (skipped excluded)"
