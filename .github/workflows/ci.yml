name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled / unlabeled carry the maintainer key that unlocks the
    # expensive tier-2 jobs (see the full-approval guard below).
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

# Least privilege: jobs only check out code and publish no artifacts.
permissions:
  contents: read
  pull-requests: read

jobs:
  full-approval:
    name: full-approval (maintainer key)
    # Two-tier CI: cheap gates run on every event; the expensive tier below
    # runs only after a maintainer attaches the ci-approved label. This
    # guard FAILS (never pends) while unapproved, so the aggregate gate is
    # red with an actionable message instead of a hanging check. GitHub
    # forbids approving your own pull request, which makes an approval
    # review unusable as the key for a solo maintainer - a label carries
    # the same consent and works on the maintainer's own PRs too. Removing
    # the label re-arms the gate (unlabeled re-triggers this workflow).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate maintainer approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "non-PR event ($EVENT): full CI runs unconditionally"
            exit 0
          fi
          if gh api "repos/$REPO/pulls/$PR_NUMBER" \
              --jq '[.labels[].name] | index("ci-approved") != null' | grep -q true; then
            echo "ci-approved label present: tier-2 unblocked"
            exit 0
          fi
          echo "::error title=Full CI awaiting approval::Tier-1 results are above; attach the ci-approved label to run the full suite (tier 2)."
          exit 1

  build-and-test:
    needs: full-approval
    if: >-
      needs.full-approval.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.action == 'labeled')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install and test steps execute PR code; a persisted checkout
          # token would be readable there.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # test/ and scripts/ are outside the build's tsconfig, so they need their own type check
      - run: npm run typecheck
      # e2e tests in test/e2e/ exercise dist/, so build must precede tests
      - run: npm run test:coverage

  # This workflow has no path filtering (single-package repo, every job runs
  # on every push/PR), so edits to dependency-policy.json or the checker
  # itself always re-trigger this job.
  deps-policy:
    name: Dependency denylist (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The install and test steps execute PR code; a persisted checkout
          # token would be readable there.
          persist-credentials: false
      # Reads package-lock.json plus package.json only; no npm install needed.
      - run: node scripts/ci/check_npm_deps_policy.mjs

  gate:
    name: gate
    # Summary check: always runs, passes when every job that ran succeeded
    # (skipped is fine) and fails on any failure or cancellation, so a
    # cancelled run can never masquerade as green.
    needs: [build-and-test, deps-policy, full-approval]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate results
        env:
          BUILD_AND_TEST: ${{ needs.build-and-test.result }}
          DEPS_POLICY: ${{ needs.deps-policy.result }}
          FULL_APPROVAL: ${{ needs.full-approval.result }}
        run: |
          set -euo pipefail
          results="build_and_test=$BUILD_AND_TEST deps_policy=$DEPS_POLICY full_approval=$FULL_APPROVAL"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more gates failed or were cancelled"
            exit 1
          fi
          echo "all gates passed (skipped excluded)"
