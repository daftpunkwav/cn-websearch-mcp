# Security: supply-chain and credential gates, split from ci.yml so a leak or
# a CVE fails its own workflow instead of being buried in the build gate noise.
#
# No path filtering on purpose: vulnerabilities appear without any code change
# (a new GHSA against an already-pinned version), so the audits re-run on every
# push/PR and on a weekly schedule that re-scans main and catches drift even
# when nothing was pushed all week. The weekly cron deliberately lands off the
# dependabot cadence so findings arrive before/around the upgrade PRs, not on
# top of them.
#
# Every "uses:" is pinned to a full commit SHA (same policy as ci.yml).
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Wednesdays 04:17 UTC — mid-week, off the dependabot weekly cadence.
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: a secret added and removed within a PR must still be
      # caught, which a shallow checkout cannot see.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The binary comes from the official release, checksum-verified, instead
      # of gitleaks-action. No automation covers this URL; bump deliberately.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o /tmp/checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" /tmp/checksums.txt \
            | sed "s|gitleaks_${V}_linux_x64.tar.gz|/tmp/gitleaks.tgz|" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan full history
        run: /tmp/gitleaks detect --source . --redact --verbose --exit-code 1

  audit:
    name: dependency audit (npm ≥ high)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # npm audit consults package-lock.json only; no install needed. The
      # checker fails on any high/critical not listed in
      # scripts/ci/npm-audit-allowlist.json and fails closed on malformed
      # input, so a broken audit run can never pass silently.
      - name: Dependency audit (fail on unlisted high+)
        run: npm audit --json | node scripts/ci/npm-audit-check.mjs

  security-gate:
    name: security-gate
    # Summary check: always runs, passes when everything that ran succeeded
    # and fails on any failure or cancellation, so a cancelled run can never
    # masquerade as green.
    needs: [secrets, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Evaluate security gate results
        env:
          SECRETS: ${{ needs.secrets.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          set -euo pipefail
          results="secrets=$SECRETS audit=$AUDIT"
          echo "$results"
          if grep -qE '=(failure|cancelled)' <<< "$results"; then
            echo "::error::one or more security gates failed or were cancelled"
            exit 1
          fi
          echo "all security gates passed"
